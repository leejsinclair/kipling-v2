name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  reviewer-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      REVIEWER_CHECKLIST_TEXT: Adversarial reviewer run completed; findings resolved or documented
    steps:
      - name: Require adversarial reviewer declaration in PR checklist
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$PR_BODY" | grep -Eiq -- "- \[[xX]\] ${REVIEWER_CHECKLIST_TEXT}"; then
            echo "::error title=Missing reviewer evidence::Check the PR template item: '${REVIEWER_CHECKLIST_TEXT}'."
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Verify (lint, build, unit tests, e2e)
        run: npm run verify
